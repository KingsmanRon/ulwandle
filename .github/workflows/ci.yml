name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pip-audit
      - name: pip-audit (vulnerabilities)
        run: pip-audit -r requirements.txt --strict
      - name: Sanity import
        env:
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars"
          DATABASE_URL: "postgresql://u:p@127.0.0.1/db"
          ANTHROPIC_API_KEY: "test"
          APP_ENV: "development"
          DEBUG: "false"
        run: python -c "import importlib; importlib.import_module('app.main')"

      - name: Unit tests
        env:
          SECRET_KEY: "ci-test-secret-key-must-be-at-least-32-chars"
          DATABASE_URL: "postgresql://u:p@127.0.0.1/db"
          ANTHROPIC_API_KEY: "test"
          APP_ENV: "development"
          DEBUG: "false"
        # Scraper-parser regression tests + staleness/model-fallback units.
        # These guard the format-dependent gov-site parsers — the things most
        # likely to break silently — so a layout change fails the build, not
        # the customer's dashboard.
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run build
        env:
          CI: "true"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
