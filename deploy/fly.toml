# Fly.io app config — backend.
# 1) `fly launch --no-deploy` once, accept defaults, then replace this file.
# 2) `fly secrets set SECRET_KEY=... DATABASE_URL=... ANTHROPIC_API_KEY=... CORS_ORIGINS=https://your-frontend.vercel.app`
# 3) `fly deploy`
# Free-tier safe: a single shared-cpu-1x machine, scaled to zero when idle.

app = "ulwandle-rac"
primary_region = "jnb"        # Johannesburg

[build]
  dockerfile = "backend/Dockerfile"

[env]
  APP_ENV = "production"
  DEBUG = "false"
  REDIS_URL = "redis://default@invalid:6379/0"   # override via Upstash secret
  CLAUDE_MODEL = "claude-sonnet-4-6"
  CLAUDE_DECISION_MODEL = "claude-opus-4-7"
  VALVE_CONTROL_ENABLED = "false"                # flip on after smoke-test
  DUAL_CONTROL_REQUIRED = "true"
  RATE_LIMIT_DEFAULT = "60/minute"
  RATE_LIMIT_AUTH = "10/minute"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[deploy]
  release_command = "alembic upgrade head"
