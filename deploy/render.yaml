# Render.com Blueprint — alternative free-tier deployment.
# Connect this repo in Render and pick "Blueprint".
services:
  - type: web
    name: ulwandle-backend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: VALVE_CONTROL_ENABLED
        value: "false"
      - key: DUAL_CONTROL_REQUIRED
        value: "true"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ulwandle-frontend
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: REACT_APP_API_URL
        sync: false
