services:
  db:
    image: postgres:16-alpine
    container_name: ulwandle_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ulwandle_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ulwandle_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    networks:
      - ulwandle_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ulwandle_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-}
      VALVE_CONTROL_ENABLED: ${VALVE_CONTROL_ENABLED:-false}
      DUAL_CONTROL_REQUIRED: ${DUAL_CONTROL_REQUIRED:-true}
    ports:
      - "127.0.0.1:8000:8000"   # bind to loopback only; expose via reverse proxy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ulwandle_internal
      - ulwandle_edge
    read_only: false
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    container_name: ulwandle_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
    networks:
      - ulwandle_edge
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true

networks:
  ulwandle_internal:
    driver: bridge
    internal: false   # set true after wiring an explicit egress proxy
  ulwandle_edge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
