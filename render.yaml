# Render Blueprint — backend only. The frontend is hosted on Vercel.
#
# Usage:
#   1) Render Dashboard → New + → Blueprint
#   2) Connect this repo, select branch `main`
#   3) Render auto-detects this file and provisions the service
#   4) Fill in the secrets it prompts for (marked `sync: false` below)
#
# After first deploy, run the bootstrap admin via Render Shell:
#   python -m scripts.bootstrap_admin --email you@example.com --name "Admin"

services:
  - type: web
    name: ulwandle-backend
    runtime: docker
    plan: free
    region: frankfurt          # closest free-tier region to South Africa
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    # Migrations run on container start via backend/start.sh.
    # Render free tier disallows preDeployCommand; switch to it on a paid plan
    # if you scale to >1 instance to avoid replicas racing on schema upgrades.
    envVars:
      # Required secrets — fill in via the Render dashboard.
      - key: SECRET_KEY
        sync: false             # python3 -c "import secrets; print(secrets.token_urlsafe(48))"
      - key: DATABASE_URL
        sync: false             # Neon: postgresql://...?sslmode=require
      - key: ANTHROPIC_API_KEY
        sync: false             # sk-ant-api03-...
      - key: REDIS_URL
        sync: false             # Upstash: rediss://...
      - key: CORS_ORIGINS
        sync: false             # https://your-frontend.vercel.app
      - key: TRUSTED_HOSTS
        sync: false             # ulwandle-backend.onrender.com

      # Production hardening — fixed values.
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: VALVE_CONTROL_ENABLED
        value: "false"           # flip to "true" only after smoke-test
      - key: DUAL_CONTROL_REQUIRED
        value: "true"
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-6
      - key: CLAUDE_DECISION_MODEL
        value: claude-opus-4-7
      - key: RATE_LIMIT_DEFAULT
        value: 60/minute
      - key: RATE_LIMIT_AUTH
        value: 10/minute
      - key: RATE_LIMIT_VALVE
        value: 20/hour

  # Weekly DWS dam-level scrape (Mondays 06:00 UTC = 08:00 SAST). Pulls
  # storage % per dam from https://www.dws.gov.za/Hydrology/Weekly/Weekly.pdf
  # and writes to dam_storage_readings.
  - type: cron
    name: ulwandle-dws-weekly
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    schedule: "0 6 * * 1"
    dockerCommand: python -m app.services.dws_scraper
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"

  # Daily Cape Town dam-level scrape (06:00 UTC = 08:00 SAST). Pulls the
  # 6 dams supplying CoCT from the public dashboard.
  - type: cron
    name: ulwandle-coct-daily
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    schedule: "0 6 * * *"
    dockerCommand: python -m app.services.coct_scraper
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
